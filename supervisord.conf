[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[program:zk-collector]
command=python -m src.main --config /app/configs/collector.yaml
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/app/logs/collector.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
environment=CONFIG_PATH="/app/configs/collector.yaml",DATA_DIR="/app/data",LOG_DIR="/app/logs",LOG_LEVEL="%(ENV_LOG_LEVEL)s",LOG_FORMAT="%(ENV_LOG_FORMAT)s",ZK_ADMIN_PASSWORD="%(ENV_ZK_ADMIN_PASSWORD)s",ENCRYPTION_KEY="%(ENV_ENCRYPTION_KEY)s",ZK_SYNC_URL="%(ENV_ZK_SYNC_URL)s",ZK_SYNC_TOKEN="%(ENV_ZK_SYNC_TOKEN)s",WEBGUI_SECRET_KEY="%(ENV_WEBGUI_SECRET_KEY)s"

[program:zk-webgui]
command=gunicorn --bind 0.0.0.0:8080 --workers 2 --timeout 120 src.webgui.server:app
directory=/app
autostart=true
autorestart=true
startretries=3
startsecs=3
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/app/logs/webgui.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
environment=CONFIG_PATH="/app/configs/collector.yaml",DATA_DIR="/app/data",LOG_DIR="/app/logs",LOG_LEVEL="%(ENV_LOG_LEVEL)s",LOG_FORMAT="%(ENV_LOG_FORMAT)s",ZK_ADMIN_PASSWORD="%(ENV_ZK_ADMIN_PASSWORD)s",ENCRYPTION_KEY="%(ENV_ENCRYPTION_KEY)s",ZK_SYNC_URL="%(ENV_ZK_SYNC_URL)s",ZK_SYNC_TOKEN="%(ENV_ZK_SYNC_TOKEN)s",WEBGUI_SECRET_KEY="%(ENV_WEBGUI_SECRET_KEY)s"

[eventlistener:supervisord-health]
command=sh -c 'while IFS= read -r line; do echo "RESULT 2 OK"; done < /dev/stdin'
events=PROCESS_STATE
process_name=zk-webgui
