openapi: 3.1.0
info:
  title: ZK-Collector API
  version: 1.0.0
  description: >
    REST API for ZK-Collector — the ZKTeco attendance collection appliance.
    The API is served by the embedded Flask WebGUI and is intended for
    LAN-local automation only. Device traffic on UDP/TCP 4370 is NOT part of
    this API and must never be exposed beyond the LAN (see docs/security.md).
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local deployment (default port)
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: health
  - name: apidocs
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  version:
                    type: string
                    example: 1.0.0
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with username/password
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '302':
          description: Redirect to dashboard on success
        '401':
          description: Invalid credentials
  /auth/logout:
    get:
      tags: [auth]
      summary: End the current session
      responses:
        '302':
          description: Redirect to login page
  /auth/setup:
    get:
      tags: [auth]
      summary: Show initial setup wizard (first run only)
      responses:
        '200':
          description: Setup form
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [auth]
      summary: Create initial admin user
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password, password_confirm]
              properties:
                username:
                  type: string
                  minLength: 3
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirm:
                  type: string
                  minLength: 8
      responses:
        '302':
          description: Redirect to login after successful setup
        '200':
          description: Show setup form with validation errors
          content:
            text/html:
              schema:
                type: string
  /auth/forgot-password:
    get:
      tags: [auth]
      summary: Show password recovery form
      responses:
        '200':
          description: Password recovery form
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [auth]
      summary: Request password recovery email
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '302':
          description: Redirect to login with info message
        '200':
          description: Show form with validation errors
          content:
            text/html:
              schema:
                type: string
  /devices/api/devices/test:
    post:
      tags: [devices]
      summary: Test connectivity to a device address (no config saved)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip:
                  type: string
                  format: ipv4
                port:
                  type: integer
                  default: 4370
                password:
                  type: integer
                  default: 0
                protocol:
                  type: string
                  enum: [tcp, udp]
                  default: tcp
                timeout:
                  type: integer
                  default: 5
      responses:
        '200':
          description: Reachable device
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  device_info:
                    type: object
                    properties:
                      firmware:
                        type: string
                      serial:
                        type: string
                      platform:
                        type: string
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/responses/BadRequest'
        '502':
          description: Device unreachable or protocol error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
  /api/docs:
    get:
      tags: [apidocs]
      summary: Interactive Swagger UI for API reference
      responses:
        '200':
          description: Swagger UI interface
          content:
            text/html:
              schema:
                type: string
  /api/openapi.yaml:
    get:
      tags: [apidocs]
      summary: Machine-readable OpenAPI 3.1 spec (YAML)
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/yaml:
              schema:
                type: string
  /api/openapi.json:
    get:
      tags: [apidocs]
      summary: Machine-readable OpenAPI 3.1 spec (JSON)
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/json:
              schema:
                type: object
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Validation error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Resource not found"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Internal server error"
securitySchemes:
  sessionCookie:
    type: apiKey
    in: cookie
    name: session
    description: Session cookie issued by POST /auth/login. LAN-only deployments may additionally restrict API routes by source IP at the reverse proxy.