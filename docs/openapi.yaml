openapi: 3.1.0
info:
  title: ZK-Collector API
  version: 1.0.0
  description: >-
    REST API for ZK-Collector — the ZKTeco attendance collection appliance.
    The API is served by the embedded Flask WebGUI and is intended for
    LAN-local automation only. Device traffic on UDP/TCP 4370 is NOT part of
    this API and must never be exposed beyond the LAN (see docs/security.md).
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: Local deployment (default port)
security:
  - sessionCookie: []
tags:
  - name: auth
  - name: devices
  - name: attendance
  - name: tokens
  - name: sync
  - name: health
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  version: { type: string, example: 1.0.0 }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with username/password
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '302': { description: Redirect to dashboard on success }
        '401': { description: Invalid credentials }
  /auth/logout:
    get:
      tags: [auth]
      summary: End the current session
      responses:
        '302': { description: Redirect to login page }
  /auth/forgot-password:
    get:
      tags: [auth]
      summary: Render the password recovery request form
      security: []
      responses:
        '200': { description: HTML form (forgot_password.html) }
    post:
      tags: [auth]
      summary: Request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '302':
          description: >
            Redirect to /auth/login. Same response for existing and unknown emails
            (no account enumeration). Creates a hashed, 1h-expiry entry in
            password_reset_tokens and sends the reset link by email when SMTP is configured.
        '429': { description: Rate limit exceeded (3 requests per hour per email) }
  /auth/reset-password:
    get:
      tags: [auth]
      summary: Render the new-password form using a query-string token
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: HTML form (reset_password.html) }
        '302': { description: Invalid, expired, used or missing token — redirect to /auth/forgot-password }
    post:
      tags: [auth]
      summary: Set a new password using a token (query string or path variant)
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password, password_confirm]
              properties:
                password: { type: string, format: password }
                password_confirm: { type: string, format: password }
      responses:
        '302':
          description: >
            On success redirect to /auth/login with the user password updated and the token
            marked as used; on validation failure re-renders the form (200).
  /auth/reset-password/{token}:
    get:
      tags: [auth]
      summary: Render the new-password form using a path token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: HTML form (reset_password.html) }
        '302': { description: Invalid, expired or used token — redirect to /auth/forgot-password }
    post:
      tags: [auth]
      summary: Set a new password using a path token
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password, password_confirm]
              properties:
                password: { type: string, format: password }
                password_confirm: { type: string, format: password }
      responses:
        '302': { description: On success redirect to /auth/login }
  /auth/api/forgot-password:
    post:
      tags: [auth]
      summary: API - request a password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Always success to prevent account enumeration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetRequestResult' }
        '400': { description: Missing email }
        '429':
          description: Rate limit exceeded (3 requests per hour per email)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetRequestResult' }
  /auth/api/reset-password:
    post:
      tags: [auth]
      summary: API - set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, password_confirm]
              properties:
                token: { type: string }
                password: { type: string, format: password }
                password_confirm: { type: string, format: password }
      responses:
        '200':
          description: Password updated and token consumed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetRequestResult' }
        '400':
          description: Weak password, mismatch, invalid/expired/used token or missing fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string }
                  errors:
                    type: array
                    items: { type: string }
  /auth/api/tokens:
    get:
      tags: [tokens]
      summary: List personal access tokens (admin sees all)
      description: >-
        Lista los PAT del usuario actual (un admin ve todos).
        Nunca devuelve el hash del token.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items: $ref: '#/components/schemas/ApiToken'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tokens]
      summary: Create a personal access token (PAT)
      description: >-
        Emite un nuevo PAT. El token plano se devuelve una sola vez.
        Requiere sesion de admin.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                scopes:
                  type: array
                  items: { type: string, enum: [read, write] }
                  default: ["read"]
                expires_in_days:
                  type: integer
                  default: 90
                  minimum: 1
                  maximum: 365
      responses:
        '201':
          description: Token created (plain token returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "zpk_..." }
                  record: $ref: '#/components/schemas/ApiToken'
        '400': { description: Validation error }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Max tokens per user reached }
    delete:
      tags: [tokens]
      summary: Revoke a personal access token
      description: Revoca un token de API por id.
      security:
        - bearerAuth: []
      parameters:
        - name: token_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/devices:
    get:
      tags: [devices]
      summary: Device status for external consumers (MYK-407)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of devices with online/offline summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items: $ref: '#/components/schemas/Device'
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      online: { type: integer }
                      offline: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/devices/{id}:
    get:
      tags: [devices]
      summary: Device status by id (MYK-407)
      security:
        - bearerAuth: []
      parameters:
        - { $ref: '#/components/parameters/deviceId' }
      responses:
        '200':
          description: Device detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/employees:
    get:
      tags: [devices]
      summary: List employees (CRUD, MYK-407)
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 20 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: department, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200':
          description: Paginated list of employees
          content:
            application/json:
              schema:
                type: object
                properties:
                  employees:
                    type: array
                    items: $ref: '#/components/schemas/Employee'
                  pagination:
                    type: object
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [devices]
      summary: Create an employee (CRUD, MYK-407)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_code, first_name, last_name]
              properties:
                employee_code: { type: string }
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string }
                phone: { type: string }
                department: { type: string }
                position: { type: string }
                hire_date: { type: string }
                notes: { type: string }
      responses:
        '201':
          description: Employee created
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: $ref: '#/components/schemas/Employee'
        '400': { description: Validation error }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: employee_code already exists }

  /api/employees/{id}:
    get:
      tags: [devices]
      summary: Get an employee by id (CRUD, MYK-407)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Employee detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: $ref: '#/components/schemas/Employee'
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [devices]
      summary: Update an employee (partial, CRUD, MYK-407)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employee_code: { type: string }
                first_name: { type: string }
                last_name: { type: string }
                email: { type: string }
                phone: { type: string }
                department: { type: string }
                position: { type: string }
                hire_date: { type: string }
                notes: { type: string }
      responses:
        '200':
          description: Employee updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  employee: $ref: '#/components/schemas/Employee'
        '400': { description: Validation error }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: employee_code already exists }
    delete:
      tags: [devices]
      summary: Soft-delete an employee (CRUD, MYK-407)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Employee deactivated
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/attendance:
    get:
      tags: [attendance]
      summary: Paginated attendance records / punches (MYK-407)
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, default: 50 } }
        - { name: start_date, in: query, schema: { type: string, format: date } }
        - { name: end_date, in: query, schema: { type: string, format: date } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: device_ip, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: integer } }
        - { name: punch_type, in: query, schema: { type: string } }
        - { name: synced, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Paginated attendance records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: $ref: '#/components/schemas/AttendanceRecord'
                  pagination:
                    type: object
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/api/devices:
    get:
      tags: [devices]
      summary: List all configured devices
      responses:
        '200':
          description: Array of devices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
    post:
      tags: [devices]
      summary: Register a new ZKTeco device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '400': { description: Validation error }
  /devices/api/devices/{id}:
    get:
      tags: [devices]
      summary: Get a device by id
      parameters:
        - { $ref: '#/components/parameters/deviceId' }
      responses:
        '200':
          description: Device detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [devices]
      summary: Update device configuration
      parameters:
        - { $ref: '#/components/parameters/deviceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceInput' }
      responses:
        '200':
          description: Updated device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [devices]
      summary: Remove a device
      parameters:
        - { $ref: '#/components/parameters/deviceId' }
      responses:
        '204': { description: Device deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/api/devices/test:
    post:
      tags: [devices]
      summary: Test connectivity to a device address (no config saved)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ip]
              properties:
                ip: { type: string, format: ipv4 }
                port: { type: integer, default: 4370 }
                password: { type: integer }
      responses:
        '200':
          description: Reachable device
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  device_info: { type: object }
        '502': { description: Device unreachable or protocol error }
  /devices/api/devices/{id}/toggle:
    post:
      tags: [devices]
      summary: Enable or disable polling for a device
      parameters:
        - { $ref: '#/components/parameters/deviceId' }
      responses:
        '200':
          description: Toggled state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/api/devices/{id}/status:
    get:
      tags: [devices]
      summary: Real-time device status
      parameters:
        - { $ref: '#/components/parameters/deviceId' }
      responses:
        '200':
          description: Live status probe
          content:
            application/json:
              schema:
                type: object
                properties:
                  online: { type: boolean }
                  users: { type: integer }
                  records: { type: integer }
                  firmware: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/api/attendance:
    get:
      tags: [attendance]
      summary: Query buffered attendance records
      parameters:
        - { name: device_id, in: query, schema: { type: integer } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Filtered attendance records
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttendanceRecord' }
  /devices/api/attendance/stats:
    get:
      tags: [attendance]
      summary: Attendance summary statistics
      parameters:
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Aggregated counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_records: { type: integer }
                  unique_users: { type: integer }
                  check_ins: { type: integer }
                  check_outs: { type: integer }
  /devices/api/attendance/export:
    get:
      tags: [attendance]
      summary: Export attendance as CSV
      parameters:
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: CSV download
          content:
            text/csv:
              schema: { type: string }
  /devices/api/sync/status:
    get:
      tags: [sync]
      summary: Cloud sync status
      responses:
        '200':
          description: Sync state
          content:
            application/json:
              schema:
                type: object
                properties:
                  last_sync: { type: string, format: date-time, nullable: true }
                  pending_records: { type: integer }
                  platform_reachable: { type: boolean }
  /devices/api/sync/trigger:
    post:
      tags: [sync]
      summary: Force an immediate sync to the platform
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced: { type: integer }
                  failed: { type: integer }
        '503': { description: Platform unreachable }
  /api/attendance/stats:
    get:
      tags: [attendance]
      summary: Attendance KPI report by period (MYK-241)
      description: >-
        Presentes, ausentes, retardos, incapacidades, vacaciones, puntualidad %
        y ausentismo % sobre dias habiles (Lun-Vie), agrupado por colaborador,
        departamento o empresa. Reglas completas en docs/attendance_stats.md.
      security:
        - bearerAuth: []
      parameters:
        - { name: start_date, in: query, schema: { type: string, format: date } }
        - { name: end_date, in: query, schema: { type: string, format: date } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: department, in: query, schema: { type: string } }
        - {
            name: group_by,
            in: query,
            schema: { type: string, enum: [employee, department, company], default: employee },
          }
      responses:
        '200':
          description: KPI report with rows, totals and meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  period:
                    type: object
                    properties:
                      start_date: { type: string, format: date }
                      end_date: { type: string, format: date }
                  group_by: { type: string }
                  work_start: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        employee_id: { type: integer }
                        employee_code: { type: string }
                        employee_name: { type: string }
                        department: { type: string }
                        days_expected: { type: integer }
                        days_present: { type: integer }
                        days_absent: { type: integer }
                        days_incapacity: { type: integer }
                        days_vacation: { type: integer }
                        late_arrivals: { type: integer }
                        punctuality_pct: { type: [number, 'null'] }
                        absenteeism_pct: { type: [number, 'null'] }
                  totals:
                    type: object
                    properties:
                      days_expected: { type: integer }
                      days_present: { type: integer }
                      days_absent: { type: integer }
                      days_incapacity: { type: integer }
                      days_vacation: { type: integer }
                      late_arrivals: { type: integer }
                      punctuality_pct: { type: [number, 'null'] }
                      absenteeism_pct: { type: [number, 'null'] }
                  meta:
                    type: object
                    properties:
                      employees_total: { type: integer }
                      unlinked_records: { type: integer }
        '400':
          description: Invalid filters (bad date, group_by or employee_id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
  /api/attendance/stats/export:
    get:
      tags: [attendance]
      summary: Export the attendance KPI report as CSV or Excel (MYK-241)
      description: Same filters as /api/attendance/stats. Adds a TOTAL row.
      security:
        - bearerAuth: []
      parameters:
        - { name: start_date, in: query, schema: { type: string, format: date } }
        - { name: end_date, in: query, schema: { type: string, format: date } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { name: department, in: query, schema: { type: string } }
        - {
            name: group_by,
            in: query,
            schema: { type: string, enum: [employee, department, company], default: employee },
          }
        - { name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }
      responses:
        '200':
          description: CSV (utf-8-sig BOM) or XLSX download
          content:
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string }
        '400':
          description: Invalid filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
  /api/buffer/retention:
    get:
      tags: [attendance]
      summary: Retención efectiva del collector para QA (MYK-505)
      description: >-
        Devuelve la retención efectiva (retention_days) del runtime,
        fuente de configuración (default|archivo+path), total de registros
        y últimas entradas del log de retención. Requiere token Bearer
        (PAT o JWT de sesión) con scope read.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Retención efectiva del collector
          content:
            application/json:
              schema:
                type: object
                properties:
                  retention_days:
                    type: integer
                    description: Días de retención efectiva del runtime
                  config_source:
                    type: string
                    enum: [default, archivo]
                    description: Fuente de la configuración de retención
                  config_path:
                    type: string
                    nullable: true
                    description: Ruta del archivo de configuración si fuente es archivo
                  total_records:
                    type: integer
                  pending_sync:
                    type: integer
                  retention_audit:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        timestamp: { type: string, format: date-time }
                        records_synced: { type: integer }
                        records_failed: { type: integer }
                        status: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie issued by POST /auth/login. LAN-only deployments may additionally restrict API routes by source IP at the reverse proxy.
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token (Authorization header), same scheme as /api/medical-leaves.
  parameters:
    deviceId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    PasswordResetRequestResult:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        retry_after: { type: integer, description: Seconds until the rate limit window resets (only on 429) }
    Device:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        ip: { type: string }
        port: { type: integer, default: 4370 }
        enabled: { type: boolean }
        status: { type: string, enum: [online, offline, error] }
        last_seen: { type: string, format: date-time, nullable: true }
    DeviceInput:
      type: object
      required: [name, ip]
      properties:
        name: { type: string }
        ip: { type: string, format: ipv4 }
        port: { type: integer, default: 4370 }
        password: { type: integer, description: Device communication password (stored Fernet-encrypted) }
        enabled: { type: boolean, default: true }
    AttendanceRecord:
      type: object
      properties:
        id: { type: integer }
        device_id: { type: integer }
        user_id: { type: string }
        timestamp: { type: string, format: date-time }
        punch_type: { type: string, enum: [check_in, check_out] }
        synced: { type: boolean }
    ApiToken:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        scopes: { type: string }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    Employee:
      type: object
      properties:
        id: { type: integer }
        employee_code: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        department: { type: string, nullable: true }
        position: { type: string, nullable: true }
        hire_date: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
