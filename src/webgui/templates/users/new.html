{% extends "base.html" %}

{% block title %}Nuevo Usuario - Attendance Collector{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="md:flex md:items-center md:justify-between mb-8">
        <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl">Nuevo Usuario</h2>
        <a href="/users" class="text-sm text-blue-600 hover:text-blue-900">&larr; Volver a usuarios</a>
    </div>

    <form method="POST" class="bg-white shadow sm:rounded-lg px-6 py-6 space-y-6">
        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700">Usuario *</label>
                <input id="username" name="username" type="text" required value="{{ form.get('username', '') }}"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div>
                <label for="full_name" class="block text-sm font-medium text-gray-700">Nombre completo</label>
                <input id="full_name" name="full_name" type="text" value="{{ form.get('full_name', '') }}"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                <input id="email" name="email" type="email" value="{{ form.get('email', '') }}"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
            <div>
                <label for="role" class="block text-sm font-medium text-gray-700">Rol</label>
                <select id="role" name="role"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                    <option value="user" {% if form.get('role', 'user') == 'user' %}selected{% endif %}>Usuario</option>
                    <option value="admin" {% if form.get('role') == 'admin' %}selected{% endif %}>Administrador</option>
                </select>
            </div>
            <div class="sm:col-span-2">
                <label for="password" class="block text-sm font-medium text-gray-700">Contraseña * (mínimo 8 caracteres)</label>
                <input id="password" name="password" type="password" required minlength="8"
                    class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
            </div>
        </div>
        <div class="flex justify-end">
            <button type="submit" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">
                Crear Usuario
            </button>
        </div>
    </form>
</div>
{% endblock %}
