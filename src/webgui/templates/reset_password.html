{% extends "base.html" %}

{% block title %}Nueva Contraseña - Attendance Collector{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-100 dark:bg-gray-900">
    <div class="max-w-md w-full space-y-8">
        <!-- Logo y título -->
        <div>
            <div class="flex justify-center">
                <svg class="h-16 w-16 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900 dark:text-gray-100">
                Nueva Contraseña
            </h2>
            <p class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400">
                Ingresa tu nueva contraseña
            </p>
        </div>

        <!-- Formulario -->
        <form class="mt-8 space-y-6" method="POST" action="/auth/reset-password/{{ token }}" x-data="{
            password: '',
            errors: [],
            validatePassword() {
                this.errors = []
                if (this.password.length < 12) this.errors.push('Mínimo 12 caracteres')
                if (!/[A-Z]/.test(this.password)) this.errors.push('Al menos una mayúscula')
                if (!/[a-z]/.test(this.password)) this.errors.push('Al menos una minúscula')
                if (!/[0-9]/.test(this.password)) this.errors.push('Al menos un número')
                if (!/[!@#$%^&*()_+\-=\[\]{};':\\|,.<>\/?]/.test(this.password)) this.errors.push('Al menos un carácter especial')
            }
        }">
            <div class="rounded-md shadow-sm space-y-4">
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Nueva Contraseña *
                    </label>
                    <div class="relative">
                        <input id="password" name="password" type="password" required x-model="password"
                            @input="validatePassword()"
                            class="appearance-none relative block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-800 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                            placeholder="••••••••">
                    </div>

                    <!-- Validación de contraseña -->
                    <div class="mt-2">
                        <div class="flex flex-wrap gap-2">
                            <span :class="password.length >= 12 ? 'text-green-600' : 'text-gray-400'" class="text-xs">
                                <span x-text="password.length >= 12 ? '✓' : '○'"></span> 12 caracteres
                            </span>
                            <span :class="/[A-Z]/.test(password) ? 'text-green-600' : 'text-gray-400'" class="text-xs">
                                <span x-text="/[A-Z]/.test(password) ? '✓' : '○'"></span> Mayúscula
                            </span>
                            <span :class="/[a-z]/.test(password) ? 'text-green-600' : 'text-gray-400'" class="text-xs">
                                <span x-text="/[a-z]/.test(password) ? '✓' : '○'"></span> Minúscula
                            </span>
                            <span :class="/[0-9]/.test(password) ? 'text-green-600' : 'text-gray-400'" class="text-xs">
                                <span x-text="/[0-9]/.test(password) ? '✓' : '○'"></span> Número
                            </span>
                            <span :class="/[!@#$%^&*()_+]/.test(password) ? 'text-green-600' : 'text-gray-400'" class="text-xs">
                                <span x-text="/[!@#$%^&*()_+]/.test(password) ? '✓' : '○'"></span> Especial
                            </span>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="password_confirm" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
                        Confirmar Nueva Contraseña *
                    </label>
                    <input id="password_confirm" name="password_confirm" type="password" required
                        class="appearance-none relative block w-full px-3 py-2 border border-gray-300 dark:border-gray-600 placeholder-gray-500 dark:placeholder-gray-400 text-gray-900 dark:text-gray-100 bg-white dark:bg-gray-800 rounded-md focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
                        placeholder="••••••••">
                </div>
            </div>

            <div>
                <button type="submit"
                    class="group relative w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Actualizar Contraseña
                </button>
            </div>
        </form>

        <div class="text-center">
            <a href="/auth/forgot-password" class="font-medium text-blue-600 dark:text-blue-400 hover:text-blue-500 dark:hover:text-blue-300">
                ← Solicitar nuevo enlace
            </a>
        </div>
    </div>
</div>
{% endblock %}
