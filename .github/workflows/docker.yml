name: Docker Build & Test

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Test Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test built image
        if: matrix.platform == 'linux/amd64'
        run: |
          docker run --rm ${{ steps.meta.outputs.tags }} --validate-config

  docker-compose-test:
    name: Docker Compose Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test environment file
        run: |
          cat > .env.test << 'EOF'
          CONFIG_PATH=/app/configs/collector.yaml.example
          ENCRYPTION_KEY=test-key-for-ci-only-not-production-use
          LOG_LEVEL=DEBUG
          LOG_FORMAT=json
          EOF

      - name: Start services with docker-compose
        run: |
          docker-compose -f docker-compose.yml --env-file .env.test up -d --build

      - name: Wait for services to be healthy
        run: |
          sleep 10
          docker-compose -f docker-compose.yml --env-file .env.test ps

      - name: Test health endpoint
        run: |
          curl -f http://localhost:8080/health || exit 1

      - name: Test API docs endpoint
        run: |
          curl -f http://localhost:8080/docs || exit 1

      - name: View logs
        run: |
          docker-compose -f docker-compose.yml --env-file .env.test logs --tail=50

      - name: Cleanup
        run: |
          docker-compose -f docker-compose.yml --env-file .env.test down -v