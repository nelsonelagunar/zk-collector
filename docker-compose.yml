services:
  zk-collector:
    build: .
    container_name: zk-collector
    restart: unless-stopped
    ports:
      - "${ZK_PORT:-8080}:8080"
    volumes:
      - zk-data:/app/data
      - ./configs:/app/configs:ro
    environment:
      - ZK_ADMIN_PASSWORD=${ZK_ADMIN_PASSWORD:-changeme}
      - ZK_COLLECTOR_DATA=/app/data
      - ZK_SYNC_URL=${ZK_SYNC_URL:-}
      - ZK_SYNC_TOKEN=${ZK_SYNC_TOKEN:-}
      - ZK_DEMO_SEED=${ZK_DEMO_SEED:-1}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  zk-data:
