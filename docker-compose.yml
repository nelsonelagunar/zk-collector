services:
  zk-collector:
    build: .
    container_name: zk-collector
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Persistent data: SQLite DBs (buffer, webgui), logs, attendance buffer
      - zk-data:/app/data
      - zk-logs:/app/logs
      # Config directory (read-only - edit configs/collector.yaml on host, then restart)
      - ./configs:/app/configs:ro
    environment:
      # Admin password for web dashboard (required)
      - ZK_ADMIN_PASSWORD=${ZK_ADMIN_PASSWORD}

      # Cloud sync (optional - leave empty to disable)
      - ZK_SYNC_URL=${ZK_SYNC_URL}
      - ZK_SYNC_TOKEN=${ZK_SYNC_TOKEN}

      # Encryption key for sensitive config values (required for production)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # Application config
      - CONFIG_PATH=/app/configs/collector.yaml
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - WEBGUI_SECRET_KEY=${WEBGUI_SECRET_KEY}

      # SMTP Configuration (for password reset emails - all required together)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_USE_TLS=${SMTP_USE_TLS}

      # Collector settings (can be overridden from collector.yaml)
      - ZK_COLLECTOR_HOST=0.0.0.0
      - ZK_COLLECTOR_PORT=8080
      - ZK_COLLECTOR_DATA=/app/data
      # Emulator configuration (when using --profile mock)
      - ZK_EMULATOR_HOST=${ZK_EMULATOR_HOST:-}
      - ZK_EMULATOR_PORT=${ZK_EMULATOR_PORT:-4370}
    entrypoint: ["/app/docker-entrypoint.sh"]
    # Native HEALTHCHECK from Dockerfile is used (interval=30s, timeout=5s, retries=3)

  # Mock profile: ZKTeco Emulator for E2E testing without physical device
  # Usage: docker-compose --profile mock up -d
  zk-emulator:
    build: .
    container_name: zk-emulator
    restart: unless-stopped
    profiles: ["mock"]
    ports:
      - "4370:4370"
    entrypoint: ["python", "-m", "mock.zk_emulator"]
    environment:
      - ZK_EMULATOR_HOST=0.0.0.0
      - ZK_EMULATOR_PORT=4370
      - MOCK_ATTENDANCE_SEED=${MOCK_ATTENDANCE_SEED:-mock/attendance_seed.json}
      - PYTHONPATH=/app
    volumes:
      - ./mock:/app/mock:ro
      - ./configs:/app/configs:ro
    depends_on:
      - zk-collector

volumes:
  zk-data:
  zk-logs: